[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-customer-support-agent"
version = "0.1.0"
description = "Local, evidence-only customer support with Ollama and SQLite"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["support_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: actual local Ollama inference, opt in with RUN_REAL_OLLAMA=1"]
