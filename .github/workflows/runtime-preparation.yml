name: Offline runtime preparation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUN_REAL_OLLAMA: '0'
  RAG_REAL_E2E: '0'
  PYTHONUTF8: '1'
  COVERAGE_FILE: '.local/runtime-preparation.coverage'
jobs:
  fake-docker-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock coverage==7.17.3
      - run: mkdir -p .local
      - name: Fake Docker transport tests; no runtime containers or model service
        run: python -m coverage run --branch --source=evaluation.container_runtime -m pytest tests/test_container_runtime.py -q
      - run: python -m coverage report --fail-under=75
      - run: python -m coverage json -o .local/runtime-preparation-coverage.json
      - name: Isolated ingress diagnostic fake transport only
        run: |
          python -m coverage run --branch --source=evaluation.container_port_diagnostic -m pytest tests/test_container_port_diagnostic.py -q
          python -m coverage report --fail-under=70
          python -m coverage json -o .local/port-diagnostic-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-preparation-proof
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local/runtime-preparation-coverage.json
            .local/port-diagnostic-coverage.json

  manual-offline-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        lock: [requirements.lock, requirements-investigation.lock]
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: '${{ matrix.lock }}'
      - run: python -m pip install -r "${{ matrix.lock }}"
      - name: Full regression except the test that shells out to Docker Compose
        run: python -m pytest -q --deselect=tests/test_container_packaging.py::test_compose_static_security_and_uds_override
  manual-offline-frontend:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - name: Synthetic browser regressions only
        run: npm run test:e2e
