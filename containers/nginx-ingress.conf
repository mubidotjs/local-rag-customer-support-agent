worker_processes 1;
pid /tmp/nginx.pid;
lock_file /tmp/nginx.lock;
error_log /dev/null;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    send_timeout 10s;
    keepalive_timeout 0;
    absolute_redirect off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map "$http_host|$http_origin" $local_request {
        default 0;
        "127.0.0.1:5173|" 1;
        "localhost:5173|" 1;
        "127.0.0.1:5173|http://127.0.0.1:5173" 1;
        "localhost:5173|http://localhost:5173" 1;
    }
    server {
        listen unix:/run/rag-ingress/.stage/http.sock;
        server_name localhost 127.0.0.1;
        if ($local_request = 0) { return 403; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        location = /health/live { default_type application/json; return 200 '{"status":"alive"}'; }
        location = /health/ready {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_next_upstream off;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 190s;
            proxy_next_upstream off;
            proxy_buffering off;
        }
        location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
    }
}
